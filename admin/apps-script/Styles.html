<style>
  :root {
    --ink: #0B0B0C;
    --paper: #FAF7F2;
    --card: #FFFFFF;
    --line: #E4DED3;
    --muted: #5C5750;
    --accent: #F73434;
    --accent-hover: #A00000;
    --danger-text: #A00000;
    --ok: #1E7B3A;
    --warn: #8A5A00;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  [v-cloak] { display: none; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 400 16px/1.5 'Barlow', system-ui, sans-serif; }
  h1, h2 { font-family: 'Poppins', system-ui, sans-serif; margin: 0; }
  .wrap { max-width: 960px; margin: 0 auto; padding: 0 16px; }

  .topbar { background: var(--ink); color: #fff; border-bottom: 3px solid var(--accent); }
  .topbar-inner { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; padding-top: 12px; padding-bottom: 12px; }
  .topbar h1 { font-size: 1.25rem; font-weight: 700; }
  .topbar h1 span { color: var(--accent); }
  .deploy { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 0.9rem; }
  .deploy a { color: #fff; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #8d8d8d; flex: none; }
  .dot.ok { background: #3ecf6b; }
  .dot.run { background: #f5b942; }
  .dot.fail { background: var(--accent); }

  .tabs { display: flex; gap: 4px; margin: 16px 0; overflow-x: auto; border-bottom: 1px solid var(--line); }
  .tab { background: none; border: 0; border-bottom: 3px solid transparent; padding: 10px 14px; font: 600 1rem 'Barlow', sans-serif; color: var(--muted); cursor: pointer; white-space: nowrap; min-height: 44px; }
  .tab.active { color: var(--ink); border-bottom-color: var(--accent); }
  .tab:hover { color: var(--ink); }

  .panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 32px; }
  .panel-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 12px; }
  .panel-head h2 { font-size: 1.25rem; }
  .muted { color: var(--muted); }
  .hint { color: var(--muted); font-size: 0.875rem; margin: 4px 0 0; }

  .list { list-style: none; margin: 0; padding: 0; }
  .row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; padding: 12px 0; border-top: 1px solid var(--line); }
  .row:first-child { border-top: 0; }
  .row-main { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1 1 220px; }
  .row-main strong { overflow-wrap: anywhere; }
  .meta { color: var(--muted); font-size: 0.9rem; }
  .row-actions { display: flex; gap: 8px; }
  .thumb { width: 64px; height: 64px; object-fit: cover; border-radius: 8px; background: var(--line); flex: none; }
  .badge { align-self: flex-start; font-size: 0.8rem; font-weight: 600; background: var(--paper); border: 1px solid var(--line); border-radius: 999px; padding: 0 8px; }
  .badge-warn { color: var(--warn); border-color: var(--warn); }

  button { font-family: 'Barlow', sans-serif; font-size: 1rem; font-weight: 600; border-radius: 8px; padding: 8px 16px; min-height: 44px; cursor: pointer; border: 2px solid transparent; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  .topbar button:focus-visible, .topbar a:focus-visible { outline-color: #fff; }
  .btn { background: var(--accent); color: var(--ink); }
  .btn:hover:not(:disabled) { background: var(--accent-hover); color: #fff; }
  .btn-secondary { background: var(--card); color: var(--ink); border-color: var(--ink); }
  .btn-secondary:hover:not(:disabled) { background: var(--ink); color: #fff; }
  .btn-danger { background: var(--card); color: var(--danger-text); border-color: var(--danger-text); }
  .btn-danger:hover:not(:disabled) { background: var(--danger-text); color: #fff; }
  .btn-danger-solid { background: var(--danger-text); color: #fff; }
  .btn-danger-solid:hover:not(:disabled) { background: var(--ink); }
  .btn-ghost { background: transparent; color: #fff; border-color: #fff; padding: 2px 12px; min-height: 36px; }
  .btn-ghost:hover:not(:disabled) { background: #fff; color: var(--ink); }

  .banner { border-radius: var(--radius); padding: 10px 14px; margin-bottom: 12px; border: 1px solid; }
  .banner-info { background: #EEF4FF; border-color: #9DB8E8; color: #17305E; }
  .banner-warn { background: #FFF6E0; border-color: #E0B24D; color: #5C3D00; }
  .banner-error { background: #FDECEC; border-color: var(--danger-text); color: #6B0000; }

  .overlay { position: fixed; inset: 0; background: rgba(11, 11, 12, 0.6); display: flex; align-items: flex-start; justify-content: center; overflow-y: auto; padding: 16px; z-index: 10; }
  .dialog { background: var(--card); border-radius: var(--radius); padding: 20px 16px; width: 100%; max-width: 560px; margin: 16px 0; }
  .dialog-small { max-width: 420px; }
  .dialog h2 { font-size: 1.2rem; margin-bottom: 16px; }
  .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; flex-wrap: wrap; }

  .field { margin-bottom: 14px; }
  .field label { display: block; font-weight: 600; margin-bottom: 4px; }
  .field abbr { color: var(--danger-text); text-decoration: none; }
  input[type="text"], input[type="date"], input[type="number"], select, textarea, input[type="file"] {
    width: 100%; font: 400 1rem 'Barlow', sans-serif; padding: 9px 10px; border: 1px solid #8a847a; border-radius: 8px; background: #fff; color: var(--ink); min-height: 44px;
  }
  input[aria-invalid="true"] { border-color: var(--danger-text); border-width: 2px; }
  .field-error { color: var(--danger-text); font-weight: 600; font-size: 0.9rem; margin: 4px 0 0; }
  .preview { display: block; max-width: 100%; max-height: 220px; border-radius: 8px; margin-top: 8px; }
  .check { display: flex; gap: 8px; align-items: center; margin-top: 12px; }
  .check input { width: 20px; height: 20px; }

  @media (max-width: 480px) {
    .tabs { gap: 0; }
    .tab { padding: 10px 6px; font-size: 0.9rem; }
    .row-actions { width: 100%; }
    .row-actions button { flex: 1; }
    .dialog-actions button { flex: 1; }
  }
  @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto; transition: none !important; } }
</style>
