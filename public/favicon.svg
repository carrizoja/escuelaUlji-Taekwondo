<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 100 100">
  <!-- Ulji Taekwondo School Favicon -->
  <defs>
    <style>
      .bg { fill: #1e40af; }
      .text { fill: white; font-family: Arial, sans-serif; font-weight: bold; }
      .accent { fill: #dc2626; }
      @media (prefers-color-scheme: dark) {
        .bg { fill: #1e40af; }
        .text { fill: white; }
        .accent { fill: #dc2626; }
      }
    </style>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" class="bg" stroke="#dc2626" stroke-width="2"/>
  
  <!-- Stylized "UL-JI" text -->
  <text x="50" y="35" text-anchor="middle" class="text" font-size="18">UL</text>
  <text x="50" y="55" text-anchor="middle" class="text" font-size="18">JI</text>
  
  <!-- Taekwondo symbol/decoration -->
  <path d="M25 70 L35 60 L45 70 L55 60 L65 70 L75 60" stroke="white" stroke-width="2" fill="none"/>
  <circle cx="50" cy="75" r="3" class="accent"/>
</svg>
